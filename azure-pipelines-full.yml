# Azure Pipeline for Resolve Accounting Application (Full Configuration)
# Comprehensive deployment pipeline with multiple stages

trigger:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    exclude:
      - README.md
      - '*.md'
      - .gitignore

pr:
  branches:
    include:
      - main
      - master
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'
  workingDirectory: 'resolve_accouting'
  appName: 'resolve-accounting-app'  # Update with your Azure App Service name
  resourceGroup: 'resolve-accounting-rg'  # Update with your Azure Resource Group
  buildConfiguration: 'Release'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build Application'
        steps:
          - task: NodeTool@0
            displayName: 'Use Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: |
              echo "=========================================="
              echo "Build Information"
              echo "=========================================="
              echo "Node version: $(node --version)"
              echo "NPM version: $(npm --version)"
              echo "Build ID: $(Build.BuildId)"
              echo "Build Number: $(Build.BuildNumber)"
              echo "Source Branch: $(Build.SourceBranch)"
              echo "=========================================="
            displayName: 'Display Build Information'

          - task: Npm@1
            displayName: 'Install root dependencies'
            inputs:
              workingDir: '.'
              verbose: false

          - task: Npm@1
            displayName: 'Install application dependencies'
            inputs:
              workingDir: '$(workingDirectory)'
              verbose: false

          - script: |
              cd $(workingDirectory)
              npm run build
            displayName: 'Build Frontend Application (Vite)'
            continueOnError: false

          - script: |
              echo "Verifying build output..."
              if [ -d "$(workingDirectory)/dist" ]; then
                echo "✓ dist directory exists"
                echo "Files in dist:"
                ls -la $(workingDirectory)/dist
                if [ -f "$(workingDirectory)/dist/index.html" ]; then
                  echo "✓ index.html found"
                else
                  echo "✗ index.html not found"
                  exit 1
                fi
              else
                echo "✗ dist directory not found"
                exit 1
              fi
            displayName: 'Verify Build Output'
            condition: succeeded()

          - task: PublishBuildArtifacts@1
            displayName: 'Publish build artifacts'
            inputs:
              pathToPublish: '$(workingDirectory)'
              artifactName: 'app'
              publishLocation: 'Container'

  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToProduction
        displayName: 'Deploy to Production'
        environment: 'production'  # Create this environment in Azure DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - task: NodeTool@0
                  displayName: 'Use Node.js $(nodeVersion)'
                  inputs:
                    versionSpec: '$(nodeVersion)'

                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service'
                  inputs:
                    azureSubscription: 'Azure-Service-Connection'  # Update with your service connection name
                    appName: '$(appName)'
                    package: '$(Pipeline.Workspace)/app'
                    deployToSlotOrASE: false
                    resourceGroupName: '$(resourceGroup)'
                    appSettings: |
                      [
                        {
                          "name": "NODE_ENV",
                          "value": "production",
                          "slotSetting": false
                        },
                        {
                          "name": "PORT",
                          "value": "8080",
                          "slotSetting": false
                        },
                        {
                          "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
                          "value": "false",
                          "slotSetting": false
                        },
                        {
                          "name": "WEBSITE_NODE_DEFAULT_VERSION",
                          "value": "~20",
                          "slotSetting": false
                        }
                      ]
                    startupCommand: 'npm start'

                - script: |
                    echo "=========================================="
                    echo "Deployment Summary"
                    echo "=========================================="
                    echo "✓ Deployment completed successfully!"
                    echo "Application URL: https://$(appName).azurewebsites.net"
                    echo "Health Check: https://$(appName).azurewebsites.net/health"
                    echo "Build ID: $(Build.BuildId)"
                    echo "=========================================="
                  displayName: 'Deployment Summary'

                - task: AzureAppServiceManage@0
                  displayName: 'Restart App Service (if needed)'
                  inputs:
                    azureSubscription: 'Azure-Service-Connection'
                    Action: 'Restart Azure App Service'
                    WebAppName: '$(appName)'
                    ResourceGroupName: '$(resourceGroup)'
                  condition: always()

